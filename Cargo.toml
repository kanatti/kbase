[workspace]
members = [".", "crates/tree-sitter-md-obsidian"]
resolver = "2"

[package]
name = "kbase"
version = "0.1.0"
edition = "2024"
description = "Personal knowledge base CLI for markdown vaults"
repository = "https://github.com/kanatti/kbase"

[lib]
name = "kbase"
path = "src/lib.rs"

[[bin]]
name = "kbase"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# SIGPIPE handling (Unix only)
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# File traversal
ignore = "0.4"
walkdir = "2.5"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.0.2"

# Terminal output
colored = "3.1"
tabled = "0.17"

# Date handling (daily notes)
chrono = "0.4"

# Tree-sitter parsing
tree-sitter = "0.26"
tree-sitter-md-obsidian = { path = "crates/tree-sitter-md-obsidian" }

# Full-text search
tantivy = "0.22"

# Utils
dirs = "6.0.0"
shellexpand = "3.1.1"
anyhow = "1.0.101"
regex = "1.12"
once_cell = "1.19"



[profile.release]
opt-level = 3
strip = true

[dev-dependencies]
assert_cmd = "2.1.2"
predicates = "3.1.4"
tempfile = "3.25.0"
serial_test = "3.0"
